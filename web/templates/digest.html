{{define "content"}}
<h1>{{.Title}}</h1>
<p class="hint"><a href="/notifications">{{t "common.back_notifications"}}</a></p>
<section class="card" aria-labelledby="digest-subject">
  <p>{{t "digest.intro" "hour" (printf "%02d" .SendHour)}}</p>
  <h2 id="digest-subject">{{.Subject}}</h2>
  <pre class="digest">{{.Text}}</pre>
</section>
{{end}}
