{{define "content"}}
<section class="card narrow" aria-labelledby="setup-title">
  <h1 id="setup-title">{{t "setup.title"}}</h1>
  <p>{{t "setup.intro" "min" .MinLength}}</p>
  <form method="post" action="/setup">
    <input type="hidden" name="csrf_token" value="{{.FormToken}}">
    <label for="token">{{t "setup.token"}}</label>
    <input id="token" name="token" autocomplete="off" required spellcheck="false" maxlength="64">
    <label for="password">{{t "setup.password"}}</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="{{.MinLength}}" maxlength="1024">
    <label for="confirm">{{t "common.repeat_password"}}</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="{{.MinLength}}" maxlength="1024">
    <button type="submit">{{t "setup.submit"}}</button>
  </form>
</section>
{{end}}
