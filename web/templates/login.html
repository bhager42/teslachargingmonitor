{{define "content"}}
<section class="card narrow" aria-labelledby="login-title">
  <h1 id="login-title">{{t "login.title"}}</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.FormToken}}">
    <label for="password">{{t "login.password"}}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus maxlength="1024">
    <label class="check"><input type="checkbox" name="remember" value="1"> {{t "login.remember"}}</label>
    <button type="submit">{{t "login.submit"}}</button>
  </form>
  <p class="hint">{{th "login.forgot_html"}}</p>
</section>
{{end}}
