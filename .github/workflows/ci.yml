name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Headers & shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SPDX license headers
        run: ./scripts/check-headers.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build from source with the go.mod toolchain: the prebuilt binary
          # may be compiled with an older Go than this module targets.
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: Unit tests (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Build
        run: make build && ./bin/tcmon version
      - name: Soak (3000 polls against the simulator)
        run: make soak SOAK_POLLS=3000

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: wallconnector, target: FuzzDecode }
          - { pkg: wallconnector, target: FuzzParseAddress }
          - { pkg: wallconnector, target: FuzzParseFirmware }
          - { pkg: alerts, target: FuzzRules }
          - { pkg: alerts, target: FuzzParseQuietHours }
          - { pkg: notify, target: FuzzEmail }
          - { pkg: energy, target: FuzzCosts }
          - { pkg: auth, target: FuzzCheckPolicy }
          - { pkg: store, target: FuzzDeviceNormalize }
          - { pkg: web, target: FuzzParseClock }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz for 60 s
        run: go test -run='^$' -fuzz="^${{ matrix.target }}$" -fuzztime=60s ./internal/${{ matrix.pkg }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/${{ matrix.pkg }}/testdata/fuzz
          retention-days: 14

  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start tcmon (self-signed HTTPS, setup mode)
        run: |
          make build
          mkdir -p "$RUNNER_TEMP/tcmon"
          TCMON_LISTEN=0.0.0.0:8443 ./bin/tcmon serve -data-dir "$RUNNER_TEMP/tcmon" > "$RUNNER_TEMP/tcmon.log" 2>&1 &
          for _ in $(seq 1 30); do
            TCMON_LISTEN=0.0.0.0:8443 ./bin/tcmon healthcheck -data-dir "$RUNNER_TEMP/tcmon" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/tcmon.log"; exit 1
      - name: ZAP baseline (fails on any warning not listed in .zap/rules.tsv)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://localhost:8443/login
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/tcmon.log"

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build tcmon and the simulator
        run: make build
      - name: Install test dependencies and ${{ matrix.browser }}
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playwright + axe (WCAG 2.2 AA, CSP, 320 px, live updates)
        working-directory: e2e
        env:
          TCMON_E2E_BROWSERS: ${{ matrix.browser }}
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tcmon:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image structure and smoke tests (size, user, no shell, hardened run)
        run: sudo scripts/image-test.sh tcmon:ci
      - name: docker compose up (deploy/compose.yaml, host folder)
        run: |
          mkdir -p "$RUNNER_TEMP/compose/data"
          sudo chown 568:568 "$RUNNER_TEMP/compose/data"
          sed 's|ghcr.io/bhager42/teslachargingmonitor:latest|tcmon:ci|' deploy/compose.yaml > "$RUNNER_TEMP/compose/compose.yaml"
          cd "$RUNNER_TEMP/compose"
          docker compose up -d --wait --wait-timeout 90
          docker compose logs tcmon | grep -q '"setup_token"'
          docker compose down
      - name: TrueNAS YAML up (deploy/truenas/custom-app.yaml, named volume)
        run: |
          sed 's|ghcr.io/bhager42/teslachargingmonitor:latest|tcmon:ci|' deploy/truenas/custom-app.yaml > "$RUNNER_TEMP/truenas.yaml"
          docker compose -p ix-tcmon -f "$RUNNER_TEMP/truenas.yaml" up -d --wait --wait-timeout 90
          docker compose -p ix-tcmon -f "$RUNNER_TEMP/truenas.yaml" logs tcmon | grep -q '"setup_token"'
          docker compose -p ix-tcmon -f "$RUNNER_TEMP/truenas.yaml" down --volumes
      - name: Vulnerability scan (Grype; fails on High/Critical with a fix)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tcmon:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  security:
    name: Vulnerabilities & licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln
      - name: Dependency licenses
        run: make licenses

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
