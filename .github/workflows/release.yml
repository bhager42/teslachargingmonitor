#
# Test, scan and publish the multi-arch image to GHCR with SBOM and SLSA
# provenance, sign it with cosign (keyless), and create a GitHub release.
# Start it either by pushing a tag vX.Y.Z, or from the Actions tab
# (Release → Run workflow on main, enter the version): the workflow then
# creates the tag on the commit it built. Verification:
# docs/INSTALL_DOCKER.md#verify.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.7.0 or 1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bhager42/teslachargingmonitor

jobs:
  image:
    name: Build, scan, publish and sign
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub release
      packages: write       # push to GHCR
      id-token: write       # keyless cosign signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and reproducible build date
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run the release from main"; exit 1
            fi
            if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/v${version}" >/dev/null; then
              echo "::error::Tag v${version} already exists"; exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Not a version: $version"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for testing (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tcmon:release-test
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.epoch }}
      - name: Image structure and smoke tests
        run: sudo scripts/image-test.sh tcmon:release-test
      - name: Vulnerability gate (Grype; High/Critical with a fix)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tcmon:release-test
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
          flavor: |
            latest=${{ !contains(steps.v.outputs.version, '-') }}
      - name: Build and push (linux/amd64, linux/arm64) with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.epoch }}
        env:
          SOURCE_DATE_EPOCH: ${{ steps.v.outputs.epoch }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Image: \`${IMAGE}:${VERSION}\`
          Digest: \`${DIGEST}\`

          Verify the signature:

          \`\`\`bash
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          # A tag push already has the tag; a manual run creates it on the
          # commit that was built (GITHUB_SHA).
          target="--verify-tag"
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && target="--target $GITHUB_SHA"
          # shellcheck disable=SC2086
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" $target \
            --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $prerelease
