# Tesla Charger Monitoring for TrueNAS SCALE 25.10+:
# Apps → Discover Apps → ⋮ → Install via YAML. See docs/INSTALL_TRUENAS.md.
# Only the time zone needs changing (line marked EDIT). Data is kept in the
# "tcmon-data" volume that TrueNAS manages on your apps pool.
services:
  tcmon:
    image: ghcr.io/bhager42/teslachargingmonitor:latest
    container_name: tcmon
    restart: unless-stopped
    user: "568:568"                 # the TrueNAS "apps" user
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["8443:8443"]
    environment:
      TZ: America/Chicago           # EDIT: your time zone
      TCMON_TLS: auto
    volumes:
      - tcmon-data:/data
      # Optional: keep the data in your own dataset instead (owned by apps,
      # 568), replacing the line above:
      # - /mnt/tank/apps/tcmon:/data
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  tcmon-data:
